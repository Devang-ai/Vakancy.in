name: Deploy Vakancy.in Frontend & Admin to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'admin-frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy-frontends:
    name: Build & Deploy Frontend & Admin to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Main Frontend Build
      - name: Install Frontend Dependencies & Build Production Assets
        env:
          VITE_API_URL: https://api.vakancy.in/api
          VITE_API_BASE_URL: https://api.vakancy.in/api
          VITE_GOOGLE_CLIENT_ID: 15631312508-0r23i2q9aaor4teum3sehvk0j65v3qi9.apps.googleusercontent.com
        run: |
          cd frontend
          npm ci
          npm run build

      # 2. Admin Frontend Build
      - name: Install Admin Frontend Dependencies & Build Production Assets
        env:
          VITE_API_URL: https://api.vakancy.in/api
          VITE_API_BASE_URL: https://api.vakancy.in/api
        run: |
          cd admin-frontend
          npm ci
          npm run build

      # 3. Deploy Main Frontend (public_html)
      - name: Deploy Frontend to Hostinger (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 46.202.161.94
          username: u777632951.vakancy.in
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ./
          local-dir: frontend/dist/
          dangerous-clean-slate: false

      # 4. Deploy Admin Frontend (public_html/admin)
      - name: Deploy Admin to Hostinger (public_html/admin)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 46.202.161.94
          username: u777632951.vakancy.in
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: admin/
          local-dir: admin-frontend/dist/
          dangerous-clean-slate: false
